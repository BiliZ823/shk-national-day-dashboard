<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="新鸿基国庆商场推广小红书聚光投放项目总结看板">
<title>新鸿基国庆投放项目总结 · 数据看板</title>
<style>

  :root{--main:#1A2B4A;--main60:#4A6085;--sub:#9AA5B5;--track:#EDF0F4;--line:#E3E7EE;--bg:#F6F7FA;--risk:#C0504D;--warn:#B07B2D;--txt:#1F2733;--gray:#758092;--add:#6B86B8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 14px 40px;}
  .hd{background:linear-gradient(135deg,#1A2B4A 0%,#2C4468 100%);border-radius:12px;padding:20px 24px;color:#fff;margin-bottom:14px;}
  .hd h1{font-size:19px;font-weight:700;}
  .hd .sub{font-size:12px;color:#C6CDDA;margin-top:6px;}
  .hd .flag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .kpi .lbl{font-size:11px;color:var(--gray);}
  .kpi .val{font-size:20px;font-weight:700;color:var(--main);margin-top:2px;}
  .kpi .note{font-size:10.5px;color:var(--gray);margin-top:2px;}
  .kpi.hit{border-color:#8FA9D8;box-shadow:0 0 0 2px rgba(26,43,74,.06);}
  .kpi.hit .val{color:#1A2B4A;}
  .done{color:#2E7D5B;font-weight:700;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .card h2{font-size:15px;color:var(--main);margin-bottom:4px;}
  .card .desc{font-size:12px;color:var(--gray);margin-bottom:12px;}
  .src{font-size:11px;color:var(--gray);text-align:center;margin-top:10px;}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  .tbl th{background:#F0F2F6;color:var(--main);padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl td{padding:5px 8px;border-bottom:1px solid #F0F2F5;}
  .tbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .tbl td.name{font-weight:600;}
  .tbl tr.addrow td{background:#F4F7FC;}
  .risk-c{color:var(--risk);font-weight:600;}
  .warn-c{color:var(--warn);font-weight:600;}
  .main-c{color:var(--main);font-weight:600;}

  /* 阶段进度条 */
  .phase-row{display:flex;align-items:center;gap:10px;margin:9px 0;}
  .phase-name{width:132px;font-size:13px;font-weight:600;color:var(--main);}
  .phase-track{flex:1;background:var(--track);height:22px;border-radius:4px;position:relative;}
  .phase-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;overflow:hidden;}
  .phase-fill span{font-size:10.5px;color:#fff;font-weight:600;white-space:nowrap;}
  .phase-pct{width:64px;font-size:13px;font-weight:700;text-align:right;}

  /* 每日柱状图 */
  .dchart{display:flex;align-items:flex-end;gap:2.5px;height:210px;padding-top:18px;border-bottom:1px solid var(--line);}
  .dcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .dbar{width:100%;border-radius:2px 2px 0 0;position:relative;}
  .dval{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--main);font-weight:600;white-space:nowrap;}
  .daxis{display:flex;gap:2.5px;margin-top:2px;}
  .daxis span{flex:1;text-align:center;font-size:9px;color:var(--gray);min-width:0;}
  .dswitch{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);margin-top:8px;}
  .dlegend{display:flex;gap:14px;font-size:11.5px;color:var(--gray);margin-bottom:2px;}
  .dlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}

  /* 路线堆叠条 */
  .rrow{display:flex;align-items:center;gap:10px;margin:7px 0;}
  .rname{width:128px;font-size:12.5px;color:var(--main);font-weight:600;flex-shrink:0;}
  .rwrap{flex:1;display:flex;align-items:center;}
  .rtrack{display:flex;height:18px;border-radius:3px;overflow:hidden;}
  .rseg-c{background:var(--sub);}
  .rseg-a{background:var(--add);}
  .rseg-i{background:var(--main);}
  .rtotal{width:52px;font-size:11.5px;color:var(--gray);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .rlegend{display:flex;gap:14px;font-size:11.5px;color:var(--gray);margin:6px 0 2px;}
  .rlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}

  /* 达人使用率条 */
  .urow{display:flex;align-items:center;gap:8px;margin:3.5px 0;}
  .uname{width:158px;font-size:12px;color:var(--txt);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .uname em{font-style:normal;color:var(--add);font-size:10.5px;font-weight:700;}
  .utrack{flex:1;background:var(--track);height:14px;border-radius:3px;position:relative;}
  .utrack.withref::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#9AA5B5;z-index:2;}
  .ufill{display:block;height:100%;border-radius:3px;}
  .ufill.over{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px);}
  .upct{width:56px;font-size:12px;font-weight:700;text-align:right;flex-shrink:0;}
  .ubudget{width:100px;font-size:10.5px;color:var(--gray);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .uadd{width:66px;font-size:10.5px;color:var(--add);text-align:right;flex-shrink:0;font-weight:700;font-variant-numeric:tabular-nums;}
  .uref{font-size:11px;color:var(--gray);margin:2px 0 8px;}
  .uref i{display:inline-block;width:14px;height:1px;background:#9AA5B5;vertical-align:3px;margin-right:4px;}
  .ulegend{display:flex;gap:14px;font-size:11px;color:var(--gray);margin:4px 0 10px;}
  .ulegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  @media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr);}.uname{width:104px;}.ubudget{display:none;}.uadd{width:52px;}.rname{width:96px;}.phase-name{width:96px;font-size:12px;}}

  /* 结论区块 */
  .conc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 10px;}
  .conc>div{background:#F7F9FC;border:1px solid var(--line);border-radius:9px;padding:11px 12px;}
  .conc .t{font-size:10.5px;color:var(--gray);}
  .conc .v{font-size:17px;font-weight:700;color:var(--main);margin:3px 0 2px;}
  .conc .s{font-size:10.5px;color:var(--gray);line-height:1.45;}
  .box{border-radius:9px;padding:12px 14px;font-size:12px;line-height:1.68;margin:10px 0;}
  .box.hl{background:#F4F7FC;border-left:3px solid var(--main);}
  .box b{color:var(--main);}
  .box .big{font-size:13px;font-weight:700;color:var(--main);display:block;margin-bottom:3px;}
  .tbl.lvl{font-size:11.5px;}
  .tbl.lvl th{padding:6px 7px;font-size:11px;}
  .tbl.lvl td{padding:5px 7px;}
  .tbl tr.gh td{background:#F0F2F6;font-weight:700;color:var(--main);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line);}
  .tbl tr.gh td span{font-weight:400;color:var(--gray);margin-left:6px;font-size:10.5px;}
  .act{counter-reset:a;list-style:none;margin:8px 0 0;}
  .act li{position:relative;padding-left:27px;font-size:12px;line-height:1.7;margin:10px 0;}
  .act li::before{counter-increment:a;content:counter(a);position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:var(--main);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:19px;}
  .act li b{color:var(--main);}
  @media(max-width:640px){.conc{grid-template-columns:1fr;}.tbl.lvl{font-size:10.5px;}.tbl.lvl th{font-size:10px;}}

  /* 密码门禁 */
  #gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1A2B4A 0%,#2C4468 100%);
    display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;}
  .gbox{background:#fff;border-radius:14px;padding:30px 32px;width:320px;max-width:88vw;box-shadow:0 18px 48px rgba(0,0,0,.28);text-align:center;}
  .gbox h3{margin:0 0 6px;font-size:16px;color:#1A2B4A;}
  .gbox p{margin:0 0 18px;font-size:12px;color:#758092;line-height:1.5;}
  .gbox input{width:100%;padding:10px 12px;font-size:14px;border:1px solid #D8DDE6;border-radius:8px;outline:none;box-sizing:border-box;letter-spacing:1px;}
  .gbox input:focus{border-color:#1A2B4A;}
  .gbox button{margin-top:12px;width:100%;padding:10px;font-size:14px;font-weight:600;color:#fff;background:#1A2B4A;border:0;border-radius:8px;cursor:pointer;}
  .gbox button:hover{background:#2C4468;}
  .gerr{margin-top:10px;font-size:12px;color:#C0504D;min-height:16px;}
  #app{display:none;}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">

    <p>新鸿基国庆商场推广 · 小红书聚光投放总结<br>请输入访问密码</p>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="off">
    <button onclick="check()">进入看板</button>
    <div class="gerr" id="err"></div>
  </div>
</div>

  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));

  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  document.getElementById("app").innerHTML = new TextDecoder("utf-8").decode(bytes);
  document.getElementById("app").style.display = "block";
  document.getElementById("gate").style.display = "none";
}

async function check(){
  var v = document.getElementById("pw").value;
  if (!v) { document.getElementById("err").textContent = "请输入密码"; return; }
  var h = await sha256(v);
  if (h === PW_HASH) {
    try { localStorage.setItem("shk_dash_ok", "1"); } catch(e) {}
    render();
  } else {
    document.getElementById("err").textContent = "密码不正确，请重试";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if (e.key === "Enter") check();
});

try {
  if (localStorage.getItem("shk_dash_ok") === "1") render();
} catch(e) {}

document.getElementById("pw").focus();
</script>
</body>
</html>
